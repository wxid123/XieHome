name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20'
          - os: windows-latest
            node: '22'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install build-only dependencies
        run: npm ci --ignore-scripts
      - name: Unified syntax, YAML, source, manifest and regression checks
        run: npm run check
      - name: Pack the validated bundle
        run: |
          node -e "require('node:fs').mkdirSync('artifacts', { recursive: true })"
          npm pack --pack-destination artifacts
      - name: Verify actual packed files and declared entry
        run: node scripts/check-package.mjs --packed-dir artifacts
